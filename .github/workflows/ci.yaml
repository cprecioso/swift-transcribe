on:
  workflow_dispatch:
  workflow_call:
  pull_request:

name: Continuous Integration

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        executable:
          - transcribe
        env:
          - runner: macos-26
            triple: arm64-apple-macosx
          - runner: macos-26-intel
            triple: x86_64-apple-macosx

    runs-on: ${{ matrix.env.runner }}

    env:
      EXECUTABLE: ${{ matrix.executable }}
      TRIPLE: ${{ matrix.env.triple }}
      OUTPUT_DIR: build-output

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - run: swift build --configuration release --product "$EXECUTABLE"
        env:
          EXECUTABLE: ${{ matrix.executable }}

      - id: set-vars
        run: |
          echo "BIN_PATH=$(swift build --configuration release --product "$EXECUTABLE" --show-bin-path)" >> "$GITHUB_OUTPUT"
          echo "VARIANT_PATH=variants/$EXECUTABLE-$TRIPLE/$EXECUTABLE" >> "$GITHUB_OUTPUT"
          echo "VERSION=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - run: |
          mkdir -p "$OUTPUT_DIR"
          jq -n "$JQ_PROGRAM" > "$OUTPUT_DIR/info.json"
        env:
          VARIANT_PATH: ${{ steps.set-vars.outputs.VARIANT_PATH }}
          VERSION: ${{ steps.set-vars.outputs.VERSION }}
          JQ_PROGRAM: |
            {
              "schemaVersion": "1.0",
              "artifacts": {
                (env.EXECUTABLE): {
                  "version": env.VERSION,
                  "type": "executable",
                  "variants": [
                    {
                      "path": env.VARIANT_PATH,
                      "supportedTriples": [env.TRIPLE]
                    }
                  ]
                }
              }
            }

      - run: |
          mkdir -p "$(dirname "$OUTPUT_DIR/$VARIANT_PATH")"
          cp "$BIN_PATH/$EXECUTABLE" "$OUTPUT_DIR/$VARIANT_PATH"
        env:
          BIN_PATH: ${{ steps.set-vars.outputs.BIN_PATH }}
          VARIANT_PATH: ${{ steps.set-vars.outputs.VARIANT_PATH }}

      - run: zip -r "../$EXECUTABLE.artifactbundle.zip" .
        working-directory: ${{ env.OUTPUT_DIR }}

      - uses: actions/upload-artifact@v7
        with:
          name: "artifactbundle-${{ matrix.EXECUTABLE}}-${{ matrix.env.TRIPLE}}"
          path: "${{ matrix.EXECUTABLE}}.artifactbundle.zip"
          if-no-files-found: error

  bundle:
    needs: build

    runs-on: ubuntu-latest

    strategy:
      matrix:
        executable:
          - transcribe

    env:
      INPUT_DIR: input
      OUTPUT_DIR: build-output

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: "artifactbundle-*"
          path: ${{ env.INPUT_DIR }}

      - run: |
          mkdir -p "$OUTPUT_DIR/variants"
          jq --slurp "$JQ_PROGRAM" ./"$INPUT_DIR"/*/info.json > "$OUTPUT_DIR/info.json"
          cp ./"$INPUT_DIR"/*/variants/* "$OUTPUT_DIR/variants/"
        env:
          JQ_PROGRAM: |
            reduce .[] as $item ({};
              . + ($item | del(.artifacts))
              | reduce ($item.artifacts // {} | to_entries[]) as $a (.;
                  .artifacts[$a.key] |= (
                    (.variants // []) as $prev
                    | . + $a.value
                    | .variants = (($prev + ($a.value.variants // [])) | unique)
                  )
                )
            )
